name: Fix calendar positioning

on:
  push:
    paths:
      - .github/calendar-position-trigger

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep calendar inside viewport
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text()

          old_css = '''    .sc-calendar {
              position: absolute;
              right: 0;
              top: calc(100% + 6px);
              z-index: 40;
              width: min(286px, calc(100vw - 70px));'''
          new_css = '''    .sc-calendar {
              position: fixed;
              z-index: 1000;
              width: min(286px, calc(100vw - 24px));
              max-height: calc(100vh - 24px);
              overflow: auto;'''
          if old_css not in text:
              raise SystemExit('Calendar CSS block not found')
          text = text.replace(old_css, new_css, 1)

          marker = '''      function openCalendar() {
            if (selected) {'''
          position_function = '''      function positionCalendar() {
            const rect = button.getBoundingClientRect();
            const margin = 12;
            const gap = 6;
            const width = Math.min(286, window.innerWidth - margin * 2);
            calendar.style.width = `${width}px`;
            calendar.style.left = `${Math.min(Math.max(margin, rect.right - width), window.innerWidth - width - margin)}px`;
            calendar.style.top = `${margin}px`;
            calendar.hidden = false;
            const height = calendar.offsetHeight;
            const below = window.innerHeight - rect.bottom - margin;
            const above = rect.top - margin;
            const top = below >= height || below >= above
              ? Math.min(rect.bottom + gap, window.innerHeight - height - margin)
              : Math.max(margin, rect.top - height - gap);
            calendar.style.top = `${Math.max(margin, top)}px`;
          }

          function openCalendar() {
            if (selected) {'''
          if marker not in text:
              raise SystemExit('Open calendar marker not found')
          text = text.replace(marker, position_function, 1)

          old_open = '''        renderCalendar();
            calendar.hidden = false;
            button.setAttribute("aria-expanded", "true");'''
          new_open = '''        renderCalendar();
            positionCalendar();
            button.setAttribute("aria-expanded", "true");'''
          if old_open not in text:
              raise SystemExit('Open calendar body not found')
          text = text.replace(old_open, new_open, 1)

          old_tail = '''      calendar.addEventListener("click", event => event.stopPropagation());
            document.addEventListener("click", closeCalendar);'''
          new_tail = '''      calendar.addEventListener("click", event => event.stopPropagation());
            window.addEventListener("resize", () => { if (!calendar.hidden) positionCalendar(); });
            document.addEventListener("click", closeCalendar);'''
          if old_tail not in text:
              raise SystemExit('Calendar listener block not found')
          text = text.replace(old_tail, new_tail, 1)

          path.write_text(text)
          PY
      - name: Remove one-time workflow
        run: rm -f .github/calendar-position-trigger .github/workflows/fix-calendar-position.yml
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Keep terminal calendar inside visible screen"
          git push
